name: Build ScreenCast APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Supports both common phone workflows:
      # 1) The extracted Android project is already at the repository root.
      # 2) ScreenCastAndroid.zip was uploaded as-is to the repository root.
      - name: Prepare project source
        run: |
          if [ ! -f settings.gradle.kts ] && [ -f ScreenCastAndroid.zip ]; then
            unzip -oq ScreenCastAndroid.zip -d .
          fi
          if [ -f settings.gradle.kts ]; then
            project_dir="."
          elif [ -f ScreenCastAndroid/settings.gradle.kts ]; then
            project_dir="ScreenCastAndroid"
          else
            echo "Could not find settings.gradle.kts. Upload ScreenCastAndroid.zip or the extracted project files."
            exit 1
          fi
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null

      - name: Install Android 36 SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCast-debug-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
          
